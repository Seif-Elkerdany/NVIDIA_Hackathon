[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "benefitbridge"
version = "0.1.0"
description = "Evidence-grounded opportunity discovery"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/benefitbridge"]

[tool.uv]
required-version = "==0.12.23"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "backend/src"
files = ["backend/src/benefitbridge"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep synthetic test files in a writable project cache on Windows and Linux.
addopts = "--strict-config --strict-markers --basetemp=.pytest_cache/tmp"
filterwarnings = ["error"]
